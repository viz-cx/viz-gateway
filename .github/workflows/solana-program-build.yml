name: Solana program build

# Builds gateway_deposit.so in CI and uploads it as an artifact, then runs the
# litesvm ABI/behavior tests against the exact bytes that were built.
# The pinocchio program has no declare_id!: the PDA is derived from the runtime
# program id, so ONE build deploys under ANY program id — no per-id source
# patching, and the deploy keypair never touches CI.
on:
  push:
    branches: [main]
    paths: ["contracts/solana/**", ".github/workflows/solana-program-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Solana CLI (agave)
        # Pinned: the .so hash depends on the agave/platform-tools release
        # (see contracts/solana/PROVENANCE.md "Reproducibility"). This version
        # must match the one recorded next to the deployed hash.
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: cargo build-sbf
        working-directory: contracts/solana
        run: cargo build-sbf

      - name: litesvm tests against the built .so
        working-directory: contracts/solana
        run: cargo test

      - name: Provenance
        run: |
          sha256sum contracts/solana/target/deploy/gateway_deposit.so
          ls -la contracts/solana/target/deploy/gateway_deposit.so

      - uses: actions/upload-artifact@v4
        with:
          name: gateway_deposit
          path: |
            contracts/solana/target/deploy/gateway_deposit.so
            contracts/solana/target/idl/gateway_deposit.json
